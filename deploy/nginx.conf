upstream learnisphere_dashboard {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream learnisphere_django {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name www.learnisphere.com;
    return 301 https://www.learnisphere.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.learnisphere.com;

    # Configure certificate paths using the deployment's managed TLS certificates.
    ssl_certificate /etc/letsencrypt/live/www.learnisphere.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.learnisphere.com/privkey.pem;

    root /var/www/learnisphere-public/dist;
    index index.html;

    location = /dashboard {
        proxy_pass http://learnisphere_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /dashboard/ {
        proxy_pass http://learnisphere_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ^~ /api/ {
        proxy_pass http://learnisphere_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
